<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safari</title>
  <link rel="stylesheet" href="index.css" />
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="register-sw.js" defer></script>
  <script src="search.js" defer></script>
  <script src="index.js" defer></script>
</head>
<body>
  <!-- Safari window chrome -->
  <div id="chrome" class="chrome">
    <div class="chrome-top">
      <div class="traffic">
        <button type="button" class="tl close" title="Close" id="btn-close"></button>
        <button type="button" class="tl min" title="Minimize" id="btn-min"></button>
        <button type="button" class="tl max" title="Maximize" id="btn-max"></button>
      </div>
      <div class="nav">
        <button type="button" id="btn-back" title="Back" aria-label="Back">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" id="btn-fwd" title="Forward" aria-label="Forward">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <form id="sj-form" class="urlbar" autocomplete="off">
        <input id="sj-search-engine" type="hidden" value="https://duckduckgo.com/?q=%s" />
        <svg class="lock" width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><path d="M6 1a2.5 2.5 0 00-2.5 2.5V5H3a1 1 0 00-1 1v4a1 1 0 001 1h6a1 1 0 001-1V6a1 1 0 00-1-1H8.5V3.5A2.5 2.5 0 006 1zm1.5 4H4.5V3.5a1.5 1.5 0 113 0V5z"/></svg>
        <input id="sj-address" type="text" placeholder="Search or enter website name" spellcheck="false" />
        <button type="submit" class="go" title="Go">Go</button>
      </form>
      <button type="button" id="btn-reload" class="icon-btn" title="Reload">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </button>
    </div>
    <div class="tabs">
      <div class="tab active"><span id="tab-title">Start Page</span></div>
    </div>
  </div>

  <div id="stage">
    <!-- Start page -->
    <div id="start" class="start">
      <svg class="compass" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" fill="url(#sg)"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
        <path d="M32 14 L36 28 L50 32 L36 36 L32 50 L28 36 L14 32 L28 28 Z" fill="#fff"/>
        <defs>
          <linearGradient id="sg" x1="8" y1="8" x2="56" y2="56">
            <stop stop-color="#5ac8fa"/><stop offset="0.5" stop-color="#007aff"/><stop offset="1" stop-color="#5856d6"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="fav-label">Favorites</div>
      <div class="favorites" id="favorites"></div>
      <p class="hint">Scramjet proxy · libcurl + Wisp · per Titanium Network docs</p>
      <p id="sj-error" class="error"></p>
      <pre id="sj-error-code" class="error-code"></pre>
    </div>
  </div>
</body>
</html>
