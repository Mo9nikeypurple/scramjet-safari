<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safari — Scramjet</title>
  <link rel="stylesheet" href="/index.css" />
  <script src="/baremux/index.js" defer></script>
  <script src="/scram/scramjet.all.js" defer></script>
  <script src="/index.js" defer></script>
</head>
<body>
  <div class="chrome">
    <div class="chrome-top">
      <div class="traffic">
        <button type="button" class="tl close" id="btn-close" title="Home"></button>
        <button type="button" class="tl min"></button>
        <button type="button" class="tl max"></button>
      </div>
      <div class="nav">
        <button type="button" id="btn-back" class="icon-btn" title="Back">‹</button>
        <button type="button" id="btn-fwd" class="icon-btn" title="Forward">›</button>
      </div>
      <form id="sj-form" class="urlbar" autocomplete="off">
        <input id="sj-address" type="text" placeholder="Search or enter website name" spellcheck="false" />
        <button type="submit" class="go">Go</button>
      </form>
      <button type="button" id="btn-reload" class="icon-btn" title="Reload">↻</button>
    </div>
    <div class="tabs"><div class="tab"><span id="tab-title">Start Page</span></div></div>
  </div>
  <div id="stage">
    <div id="start" class="start">
      <svg class="compass" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="30" fill="url(#g)"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="#fff" stroke-width="2.5" opacity=".9"/>
        <path d="M32 14l4 14 14 4-14 4-4 14-4-14-14-4 14-4z" fill="#fff"/>
        <defs>
          <linearGradient id="g" x1="8" y1="8" x2="56" y2="56">
            <stop stop-color="#5ac8fa"/><stop offset=".5" stop-color="#007aff"/><stop offset="1" stop-color="#5856d6"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="fav-label">Favorites</div>
      <div class="favorites" id="favorites"></div>
      <p class="hint">Real Scramjet · your server · not a demo iframe</p>
      <p id="status">Registering service worker…</p>
      <p id="err"></p>
    </div>
  </div>
</body>
</html>
